<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>YTM Audio-Only Player</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f; color: #eee; display: flex; height: 100vh;
    }
    #left { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #right { width: 360px; border-left: 1px solid #262626; display: flex; flex-direction: column; }

    header { padding: 14px 18px; border-bottom: 1px solid #262626; }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
    header .sub { font-size: 12px; color: #9a9a9a; margin-top: 3px; }

    #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 18px; min-height: 0; }
    #frameWrap { width: 100%; max-width: 640px; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
    #yt { width: 100%; height: 100%; border: 0; display: block; }

    #controls { padding: 14px 18px; border-top: 1px solid #262626; display: flex; flex-direction: column; gap: 10px; }
    #nowTitle { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #nowChannel { font-size: 12px; color: #9a9a9a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row { display: flex; align-items: center; gap: 12px; }
    button.ctrl {
      background: #272727; color: #eee; border: 0; border-radius: 999px;
      width: 40px; height: 40px; font-size: 16px; cursor: pointer;
    }
    button.ctrl:hover { background: #383838; }
    button.ctrl.primary { background: #fff; color: #111; width: 48px; height: 48px; font-size: 18px; }

    #queueHead { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px; }
    #right h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: #9a9a9a; margin: 0; }
    #queueBtns { display: flex; gap: 8px; align-items: center; }
    #clear, #openYtm { background: #272727; color: #eee; border: 0; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
    #clear:hover, #openYtm:hover:not(:disabled) { background: #383838; }
    #openYtm:disabled { opacity: .4; cursor: default; }
    #info { padding: 0 18px 8px; font-size: 12px; color: #9a9a9a; }
    #list { flex: 1; overflow-y: auto; padding: 0 8px 14px; }
    .track { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
    .track:hover { background: #1c1c1c; }
    .track.active { background: #232323; }
    .track.dragging { opacity: .5; }
    .track .grip { color: #5a5a5a; font-size: 13px; cursor: grab; flex: 0 0 auto; }
    .track:hover .grip { color: #8a8a8a; }
    .track .num { width: 22px; text-align: right; color: #8a8a8a; font-size: 12px; font-variant-numeric: tabular-nums; }
    .track.active .num { color: #4da3ff; }
    .track .meta { min-width: 0; flex: 1; }
    .track .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track .c { font-size: 11px; color: #8a8a8a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track .rm { flex: 0 0 auto; background: transparent; color: #6a6a6a; border: 0; border-radius: 6px; width: 24px; height: 24px; font-size: 12px; cursor: pointer; opacity: 0; }
    .track:hover .rm { opacity: 1; }
    .track .rm:hover { background: #3a2020; color: #ff7676; }
    .track.dead { opacity: .4; text-decoration: line-through; }
  </style>
</head>
<body>
  <div id="left">
    <header>
      <h1>YTM Audio-Only</h1>
      <div class="sub" id="headerSub">Open the popup or click "Audio-only" on a YouTube Music album to start.</div>
    </header>
    <div id="stage">
      <div id="frameWrap">
        <iframe id="yt" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </div>
    <div id="controls">
      <div>
        <div id="nowTitle">Nothing playing</div>
        <div id="nowChannel"></div>
      </div>
      <div class="row" style="justify-content:center;">
        <button class="ctrl" id="prev" title="Previous">⏮</button>
        <button class="ctrl primary" id="playpause" title="Play/Pause">▶</button>
        <button class="ctrl" id="next" title="Next">⏭</button>
      </div>
    </div>
  </div>
  <div id="right">
    <div id="queueHead">
      <h2>Queue</h2>
      <div id="queueBtns">
        <button id="openYtm" title="Open this album on YouTube Music in a new tab" disabled>↗ YTM</button>
        <button id="clear" title="Clear the queue and stop playback">Clear</button>
      </div>
    </div>
    <div id="info">No album loaded yet.</div>
    <div id="list"></div>
  </div>
  <script src="player.js"></script>
</body>
</html>
