<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    body { width: 300px; margin: 0; padding: 14px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #eee; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    input[type=text] { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #eee; font-size: 13px; }
    .btn { width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 8px; background: #fff; color: #111; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn.secondary { background: #272727; color: #eee; }
    .ctrls { display: flex; gap: 8px; margin-top: 12px; }
    .ctrls button { flex: 1; padding: 9px; border: 0; border-radius: 8px; background: #272727; color: #eee; cursor: pointer; font-size: 15px; }
    .ctrls button:hover { background: #383838; }
    #now { margin-top: 12px; font-size: 12px; color: #bbb; min-height: 16px; }
    #now b { color: #eee; }
    #msg { margin-top: 8px; font-size: 12px; min-height: 14px; }
    #msg.err { color: #ff7676; }
    #msg.ok { color: #6fcf73; }
    .link { margin-top: 12px; font-size: 12px; }
    .link a { color: #4da3ff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>YTM Audio-Only</h1>
  <input id="input" type="text" placeholder="Paste album / playlist URL or ID" />
  <button class="btn" id="play">Play audio-only</button>
  <button class="btn secondary" id="add">Add to queue</button>
  <button class="btn secondary" id="open">Open player tab</button>
  <button class="btn secondary" id="clear">Clear queue</button>

  <div class="ctrls">
    <button id="prev" title="Previous">⏮</button>
    <button id="ppause" title="Play/Pause">▶</button>
    <button id="next" title="Next">⏭</button>
  </div>

  <div id="now"></div>
  <div id="msg"></div>
  <div class="link"><a id="opts">Set Data API key (Options)</a></div>

  <script src="popup.js"></script>
</body>
</html>
